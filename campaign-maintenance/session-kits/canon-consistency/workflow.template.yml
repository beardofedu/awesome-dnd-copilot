name: Canon manifest checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Check out PR data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Validate manifest without running PR code
        run: |
          test ! -L head/canon
          test ! -L head/canon/facts.json
          test -f head/canon/facts.json
          python3 -I base/.github/session-kits/canon-consistency/check_canon.py head/canon/facts.json
