name: Resource catalog checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated catalog and source links
        run: |
          python3 catalog/build.py --check
          python3 -m unittest discover -s catalog -p 'test_*.py' -v
      - name: Check search and filter behavior
        run: node --test catalog/catalog.test.cjs
