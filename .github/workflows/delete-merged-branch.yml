name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { pull_request: pullRequest, repository } = context.payload;

            if (
              pullRequest.head.repo?.full_name !== repository.full_name ||
              pullRequest.head.ref === repository.default_branch
            ) {
              core.info('Skipping a fork or the default branch.');
              return;
            }

            try {
              await github.rest.git.deleteRef({
                ...context.repo,
                ref: `heads/${pullRequest.head.ref}`,
              });
              core.info(`Deleted ${pullRequest.head.ref}.`);
            } catch (error) {
              if (error.status === 422) {
                core.info(`${pullRequest.head.ref} was already deleted.`);
                return;
              }
              throw error;
            }
